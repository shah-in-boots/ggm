# load order matters:
#   uplot        -> library itself
#   ggm-dispatch -> creates window.GGM (registry + shiny router)
#   adapter      -> registers itself into GGM.adapters
# ggm_plot.js (the binding) is loaded automatically by name
dependencies:
  - name: uplot
    version: 1.6.32
    src: htmlwidgets/lib/uplot
    script: uPlot.iife.min.js
    stylesheet: uPlot.min.css
  - name: ggm-core
    version: 0.1.0
    src: htmlwidgets/lib/ggm
    stylesheet: ggm-uplot.css
    script:
      - ggm-dispatch.js
      - ggm-adapter-uplot.js
