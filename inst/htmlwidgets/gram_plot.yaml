# Only what every backend shares. The chosen backend's library and adapter
# travel with the widget instead, attached by gram_plot() through
# createWidget(dependencies = ), so a plotly widget never fetches uPlot and
# vice versa. gram_plot.js (the binding) is loaded automatically by name.
dependencies:
  # Pre-release, so this version is not tracked against the package. It is the
  # only varying part of the asset URL, so if a browser serves stale css or js
  # during development, hard-reload rather than bumping it.
  - name: gram-core
    version: 0.4.0
    src: htmlwidgets/lib/gram
    stylesheet: gram-core.css
    script: gram-core.js
