# load order matters:
#   uplot         -> library itself
#   gram-dispatch -> creates window.GRAM (registry + shiny router)
#   adapter       -> registers itself into GRAM.adapters
# gram_plot.js (the binding) is loaded automatically by name
dependencies:
  - name: uplot
    version: 1.6.32
    src: htmlwidgets/lib/uplot
    script: uPlot.iife.min.js
    stylesheet: uPlot.min.css
  # Pre-release, so this version is not tracked against the package. It is the
  # only varying part of the asset URL, so if a browser serves stale css or js
  # during development, hard-reload rather than bumping it.
  - name: gram-core
    version: 0.3.0
    src: htmlwidgets/lib/gram
    stylesheet: gram-uplot.css
    script:
      - gram-dispatch.js
      - gram-adapter-uplot.js
