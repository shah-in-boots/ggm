# load order matters:
#   anime     -> window.anime (UMD build, no module loader needed)
#   gram-anim -> creates window.GRAMAnim, reads the anime global
# gram_tracing.js (the binding) is loaded automatically by name
dependencies:
  - name: anime
    version: 4.5.0
    src: htmlwidgets/lib/anime
    script: anime.umd.min.js
  - name: gram-anim
    version: 0.1.0
    src: htmlwidgets/lib/gram
    stylesheet: gram-tracing.css
    script: gram-anim.js
