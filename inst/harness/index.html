<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>gram harness</title>
  {{ headContent() }}
</head>
<body>

  <div class="masthead">
    <h1>gram harness</h1>
    <span class="record">{{ record }}</span>
  </div>

  <div class="layout">

    <div class="pane stacked">
      <div class="pane">
        <h2>Signal <span class="controls">{{ reset }}</span></h2>
        <div class="signal">
          {{ viewer }}
          <div class="channels">{{ channels }}</div>
        </div>
      </div>
      <div class="pane">
        <h2>Tracing</h2>
        {{ tracing }}
      </div>
    </div>

    <div class="pane console">
      <h2>Script</h2>
      {{ script }}
      {{ run }}
      {{ status }}
    </div>

  </div>

</body>
</html>
